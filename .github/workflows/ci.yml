name: "CI"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    # No beCPG instance is reachable here, so the build is the only end-to-end
    # check CI can run: it catches a broken import, a client component reaching
    # for a server module, and any TypeScript file sneaking in.
    - name: Build
      run: npm run build
      env:
        SESSION_COOKIE_SECRET: ci-build-only-not-a-secret
