version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The stack is fixed (Next.js, React, Tailwind): grouping keeps a framework
      # bump as one reviewable pull request instead of three that must land together.
      stack:
        patterns:
          - "next"
          - "eslint-config-next"
          - "react"
          - "react-dom"
          - "tailwindcss"
          - "@tailwindcss/*"
      dev:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
